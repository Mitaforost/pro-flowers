@@include('./common/header.html')
<section class="register-section m-100">
    <div class="container">
        <form class="register-form" id="registerForm" method="post">
            <h2 class="register-form__title ui-text ui-text--size-xxl ui-text--uppercase ui-text--weight-400">
                Регистрация
            </h2>
            <p class="register-form__subtitle ui-text ui-text--size-s ui-text--weight-400">
                Создайте аккаунт, чтобы получать бонусы и управлять заказами
            </p>

            <div class="register-form__fields">
                <div class="register-form__field">
                    <label class="ui-text ui-text--size-xxs">Имя</label>
                    <input type="text" name="first_name" placeholder="Ваше имя">
                </div>

                <div class="register-form__field">
                    <label class="ui-text ui-text--size-xxs">Email (необязательно)</label>
                    <input type="email" name="email" placeholder="your@email.com">
                </div>

                <div class="register-form__field register-form__field--full">
                    <label class="ui-text ui-text--size-xxs">Телефон *</label>
                    <input type="tel" name="phone" placeholder="+375 (__) ___-__-__" required>
                </div>

                <div class="register-form__field">
                    <label class="ui-text ui-text--size-xxs">Пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" placeholder="Минимум 6 символов" required>
                        <button type="button" class="password-toggle" aria-label="Показать/скрыть пароль">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s2-7 11-7 11 7 11 7-2 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="register-form__field">
                    <label class="ui-text ui-text--size-xxs">Подтверждение пароля *</label>
                    <div class="password-wrapper">
                        <input type="password" name="confirm_password" placeholder="Повторите пароль" required>
                        <button type="button" class="password-toggle" aria-label="Показать/скрыть пароль">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s2-7 11-7 11 7 11 7-2 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="register-form__checkbox register-form__field--full">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="privacy_consent" required>
                        <span>
                            Я согласен на <a href="page-privacy.html" target="_blank">обработку персональных данных</a> и принимаю условия <a href="page-offer.html" target="_blank">публичной оферты</a>
                        </span>
                    </label>
                </div>

                <div class="register-form__checkbox register-form__field--full">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="newsletter">
                        <span>Подписаться на новости и акции</span>
                    </label>
                </div>

                <button type="submit" class="button button--primary button--lg register-form__submit">Зарегистрироваться</button>

                <div class="register-form__login">
                    <p>Уже есть аккаунт? <a href="page-authorization.html">Войти</a></p>
                </div>
            </div>
        </form>
    </div>
</section>

@@include('./common/footer.html')
