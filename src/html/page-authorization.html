@@include('./common/header.html')
<section class="auth-section m-100">
    <div class="container">
        <form class="auth-form" id="loginForm" method="post">
            <h2 class="auth-form__title ui-text ui-text--size-xxl ui-text--uppercase ui-text--weight-400">
                Вход в личный кабинет
            </h2>
            <p class="auth-form__subtitle ui-text ui-text--size-s ui-text--weight-400">
                Введите номер телефона и пароль
            </p>

            <div class="auth-form__fields">
                <div class="auth-form__field">
                    <label class="ui-text ui-text--size-xxs">Телефон *</label>
                    <input type="tel" name="phone" placeholder="+375 (__) ___-__-__" required>
                </div>

                <div class="auth-form__field">
                    <label class="ui-text ui-text--size-xxs">Пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" aria-label="Показать/скрыть пароль">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s2-7 11-7 11 7 11 7-2 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-form__row">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="rememberme">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="page-forgot-password.html" class="auth-form__forgot-link">Забыли пароль?</a>
                </div>

                <button type="submit" class="button button--primary button--lg auth-form__submit">Войти</button>

                <div class="auth-form__register">
                    <p>Нет аккаунта? <a href="page-registration.html">Зарегистрироваться</a></p>
                </div>
            </div>
        </form>
    </div>
</section>

@@include('./common/footer.html')
